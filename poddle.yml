poddle:
  version: "1.0"
  project: "vuka"
  appName: "payment"
  type: WEB_SERVICE
  health: /api/v1/health
  port: 8080
  env:
    qa:
      branch: main
      entryPoint: "src/index.js"
      domain: "api.poddleops.com"
      specs:
        compute:
          cpu: 2
          memory: 2
          storage: 30
          autoScaling:
            replica:
              min: 1
              max: 3
        database:
          cpu: 2
          memory: 2
          storage: 50
          engine: "postgres"
          version: "16"
      variables:
        BASE_URL: "/api/v1"
