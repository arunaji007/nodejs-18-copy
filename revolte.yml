revolte:
  version: "1.0"
  project: "New Project"
  appName: "New Application"
  config:
    codeQuality:
      codeStyle:
        rules:
          "javascript/arrayCallbackReturn": off
          "javascript/constructorSuper": error
          "typescript/forDirection": warn
  env:
    qa:
      codeQuality: true
      branch: "testing-pipeline"
      services:
        rid_1:
          name: "auth-service"
          type: "WEB_SERVICE"
          entryPoint: "app.ts"
          specifications:
            cpu: 2
            memory: 2
            storage: 30
          properties:
            health: "/health"
            port: 8080
