revolte:
  version: "1.0"
  project: "instagram"
  appName: "subscription"
  env:
    qa:
      branch: testing-services
      services:
        rid_1:
          name: "auth-service"
          type: "WEB_SERVICE"
          entryPoint: "app.ts"
          specifications:
            cpu: 2
            memory: 2
            storage: 30
          properties:
            health: "/health"
            port: 8081
            variables:
              BASE_URL: "#{base_Url}"
              DBDIALECT: "postgres"
              DATABASE_URL: "#{userDatabase.dbUrl}"
              DATABASE_PORT: "#{userDatabase.dbPort}"
              DATABASE_USERNAME: "#{userDatabase.dbUsername}"
              DATABASE_PASSWORD: "#{userDatabase.dbPassword}"
              DATABASE_NAME: "#{userDatabase.dbName}"
              PORT: "8081"
              JWT_SECRET_KEY: "YTI4OTYyZmQ2MjYxZDI2ZWYzMWI0MjM1Y2I0MmYxMGZmMGZkOGEwNg=="
              GEOSERVER_USERNAME: "admin"
              GEOSERVER_PASSWORD: "geoserver"
              GEOSERVER_HOST: "http://localhost:8080"
              AWS_SECRET_ACCESS_KEY: "test"
              AWS_REGION: "us-east-1"
              S3_WORK_ORDER_BUCKET_NAME: "mapaki-workorder-attachments"
              S3_MAP_PORTAL_BUCKET_NAME: "map-portal-attachments"
              S3_BUCKET_REGION: "ca-central-1"
              NODE_ENV: "production"
        rid_2:
          name: "userDatabase"
          type: "DATABASE"
          specifications:
            cpu: 2
            memory: 1
            storage: 50
            engine: "mysql"
