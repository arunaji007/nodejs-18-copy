revolte:
  version: "1.0"
  project: "Swimlab"
  appName: "swimlab-api"
  env:
    qa:
      branch: "testing-services"
      services:
        rid_1:
          name: "auth-service"
          type: "WEB_SERVICE"
          entryPoint: "app.ts"
          specifications:
            cpu: 2
            memory: 2
            storage: 30
          properties:
            health: "/health"
            port: 8080
    staging:
      branch: "testing-services"
      services:
        rid_1:
          name: "auth-service"
          type: "WEB_SERVICE"
          entryPoint: "app.ts"
          specifications:
            cpu: 2
            memory: 4
            storage: 30
          properties:
            health: "/health"
            port: 8080
    production:
        branch: "testing-services"
        services:
          rid_1:
            name: "auth-service"
            type: "WEB_SERVICE"
            entryPoint: "app.ts"
            specifications:
              cpu: 2
              memory: 2
              storage: 30
              autoScaling:
                replica:
                  min: 1
                  max: 3
            properties:
              health: "/health"
              port: 8080
              variables:
                PORT: "8080"
