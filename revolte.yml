revolte:
  version: "1.0"
  project: "instagram"
  appName: "subscription"
  env:
    qa:
      branch: "testing-services"
      services:
        rid_1:
          name: "auth-service"
          type: "WEB_SERVICE"
          entryPoint: "app.ts"
          specifications:
            cpu: 2
            memory: 4
            storage: 30
          properties:
            health: "/health"
            port: 8080
            variables:
              DBDIALECT: "postgres"
              DATABASE_URL: "#{userDatabase.dbUrl}"
              DATABASE_PORT: "#{userDatabase.dbPort}"
              DATABASE_USERNAME: "#{userDatabase.dbUsername}"
              DATABASE_PASSWORD: "#{userDatabase.dbPassword}"
              DATABASE_NAME: "#{userDatabase.dbName}"
              PORT: "8080"
        rid_2:
          name: "userDatabase"
          type: "DATABASE"
          specifications:
            engine: "mysql"
            cpu: 2
            memory: 1
            storage: 20
    production:
        branch: "testing-services"
        services:
          rid_1:
            name: "auth-service"
            type: "WEB_SERVICE"
            entryPoint: "app.ts"
            specifications:
              cpu: 2
              memory: 4
              storage: 30
              autoScaling:
                replica:
                  min: 1
                  max: 3
            properties:
              health: "/health"
              port: 8080
              variables:
                DBDIALECT: "postgres"
                DATABASE_URL: "#{userDatabase.dbUrl}"
                DATABASE_PORT: "#{userDatabase.dbPort}"
                DATABASE_USERNAME: "#{userDatabase.dbUsername}"
                DATABASE_PASSWORD: "#{userDatabase.dbPassword}"
                DATABASE_NAME: "#{userDatabase.dbName}"
                PORT: "8080"
          rid_2:
            name: "userDatabase"
            type: "DATABASE"
            specifications:
              engine: "mysql"
              cpu: 2
              memory: 1
              storage: 20
                
  
